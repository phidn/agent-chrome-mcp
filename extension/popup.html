<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Chrome MCP</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      width: 320px;
      margin: 0;
      padding: 12px 14px;
      line-height: 1.4;
      font-size: 13px;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    header img { width: 20px; height: 20px; }
    header .title { font-weight: 700; font-size: 14px; flex: 1 1 auto; }
    .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin-bottom: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; flex: 0 0 auto; }
    .dot.ok { background: #2e7d32; }
    .dot.bad { background: #c62828; }
    .meta { color: #888; font-size: 11px; margin-left: auto; }
    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid rgba(127,127,127,0.4);
      border-radius: 6px;
      background: rgba(127,127,127,0.08);
      color: inherit;
    }
    .search:focus { outline: none; border-color: #d97757; }
    .count { font-size: 11px; color: #888; margin: 0 0 6px; }
    ul.tools { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow-y: auto; }
    ul.tools li { padding: 6px 4px; border-bottom: 1px solid rgba(127,127,127,0.15); }
    ul.tools li:last-child { border-bottom: none; }
    .tname { font-weight: 600; }
    .tname code { background: rgba(127,127,127,0.15); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .tdesc { color: #888; font-size: 11.5px; margin-top: 1px; }
    .footer { margin-top: 10px; display: flex; gap: 8px; }
    button {
      flex: 1 1 auto;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button.primary { background: #d97757; color: #fff; border-color: #d97757; }
    .empty { color: #888; padding: 8px 4px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <span class="title">Agent Chrome MCP</span>
    <span class="meta" id="version"></span>
  </header>

  <div class="conn">
    <span class="dot" id="dot"></span>
    <span id="connText">Checking…</span>
  </div>

  <input type="text" id="search" class="search" placeholder="Search tools…" autocomplete="off" spellcheck="false" />

  <p class="count" id="count"></p>
  <ul class="tools" id="tools">
    <li class="empty">Loading tools…</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
